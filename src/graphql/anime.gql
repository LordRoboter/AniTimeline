query MediaUserQuery ($username: String, $type: MediaType, $statusNotIn: [MediaListStatus]) {
  MediaListCollection (userName: $username, type: $type, status_not_in: $statusNotIn) {
    lists {
      isCustomList
      entries {
        status
        media {
          id
          title {
            romaji
          }
          bannerImage
          coverImage {
            medium
            extraLarge
          }
        }
        completedAt {
          day
          month
          year  
        }
        startedAt {
          day
          month
          year
        }
      }
    }
  }
}